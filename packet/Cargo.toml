[package]
name = "rustybgp-packet"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
byteorder = "1"
bytes = "1"
fnv = "1"
tokio-util = { version = "0.7", features = ["codec"] }
thiserror = "2"

[[bench]]
name = "as_path"
harness = false

[features]
default = []
packed-as-paths = []

[[bench]]
name = "packed_as_path"
harness = false
required-features = ["packed-as-paths"]
